<!DOCTYPE html>
<html>
<head>
<title>MediStock</title>

<style>
body{
    font-family:Arial;
    background:#f2f2f2;
}

section{
    width:350px;
    margin:80px auto;
    padding:20px;
    background:white;
    border:1px solid black;
    text-align:center;
}

input{
    width:90%;
    padding:8px;
    margin:8px;
}

a{
    display:inline-block;
    padding:10px 25px;
    background:blue;
    color:white;
    text-decoration:none;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid black;
    padding:10px;
}

#stock{
    display:none;
}

#stock:target{
    display:block;
}

#stock:target ~ #login{
    display:none;
}
</style>

</head>

<body>

<section id="stock">

<h2>MediStock</h2>
<h3>Medicine Stock</h3>

<table>
<tr>
<th>Medicine</th>
<th>Stock</th>
</tr>

<tr>
<td>Paracetamol</td>
<td>50</td>
</tr>

<tr>
<td>Crocin</td>
<td>25</td>
</tr>

<tr>
<td>Insulin</td>
<td>10</td>
</tr>

<tr>
<td>Amoxicillin</td>
<td>35</td>
</tr>

</table>

</section>

<section id="login">

<h2>MediStock Login</h2>

Username<br>
<input type="text"><br>

Password<br>
<input type="password"><br><br>

<a href="#stock">Login</a>

</section>

</body>
</html>
